<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CutOut Seller — Privacy Policy</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      max-width: 540px;
      width: 100%;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: #eef2ff;
      color: var(--primary);
      font-weight: 600;
      font-size: 0.825rem;
      border-radius: 9999px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.025em;
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 0.875rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    a.btn-primary {
      background: var(--primary);
      color: #ffffff;
    }
    a.btn-primary:hover {
      background: var(--primary-dark);
    }
    a.btn-secondary {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    a.btn-secondary:hover {
      background: #f1f5f9;
    }
    .footer {
      margin-top: 2rem;
      font-size: 0.825rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">CutOut Seller</div>
    <h1>Privacy Policy</h1>
    <p>Please choose your preferred language to view the privacy policy for CutOut Seller.<br>กรุณาเลือกภาษาเพื่ออ่านนโยบายความเป็นส่วนตัว</p>
    <div class="buttons">
      <a href="./th/" class="btn btn-primary">ภาษาไทย (Thai)</a>
      <a href="./en/" class="btn btn-secondary">English</a>
    </div>
    <div class="footer">
      Developer: Vrit &bull; On-Device First &bull; 100% Offline Core &bull; Zero Server Uploads
    </div>
  </div>
</body>
</html>
